<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 940" width="860" height="940" style="background:#ffffff; font-family:'Plus Jakarta Sans', Arial, sans-serif;">
  <defs>
    <pattern id="grid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="0.8" />
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#e2e8f0" stroke-width="1.2" />
    </pattern>
    <marker id="arr-cmp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#grid3)" />

  <!-- ENCABEZADO -->
  <g transform="translate(30, 20)">
    <rect width="800" height="65" rx="8" fill="#f8fafc" stroke="#4338ca" stroke-width="2" />
    <text x="20" y="28" font-size="10.5" font-weight="800" fill="#4338ca" letter-spacing="1">OPCIÓN 3 · COMPONENTES UML 2.5 (INTERFACES &amp; PUERTOS)</text>
    <text x="20" y="48" font-size="14.5" font-weight="900" fill="#0f172a">Diagrama de Componentes de Software y Puertos de Comunicación</text>
    <rect x="670" y="20" width="110" height="25" rx="5" fill="#4338ca" />
    <text x="725" y="36" text-anchor="middle" font-size="9.5" font-weight="800" fill="#ffffff">UML 2.5 COMP</text>
  </g>

  <!-- COMPONENTE 1: FRONTEND SPA -->
  <g transform="translate(230, 105)">
    <rect width="400" height="90" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="2" />
    <!-- Icono componente UML -->
    <rect x="365" y="10" width="25" height="18" fill="#ffffff" stroke="#2563eb" stroke-width="1.2" />
    <rect x="360" y="13" width="10" height="4" fill="#2563eb" />
    <rect x="360" y="21" width="10" height="4" fill="#2563eb" />

    <text x="15" y="28" font-size="10" font-weight="700" fill="#64748b">&lt;&lt;component&gt;&gt;</text>
    <text x="15" y="46" font-size="13" font-weight="900" fill="#1e293b">Frontend SPA (React + Tailwind)</text>
    <text x="15" y="64" font-size="9" font-weight="600" fill="#334155">• Páginas de Operación, Widgets en vivo y Servicios API</text>
    <text x="15" y="78" font-size="9" font-weight="600" fill="#64748b">Directorio: /frontend</text>
  </g>

  <!-- Interfaces Lollipop / Socket entre Frontend y Backend -->
  <g transform="translate(430, 195)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#1e293b" stroke-width="1.8" />
    <!-- Lollipop Provista (Circle) -->
    <circle cx="0" cy="40" r="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <!-- Socket Requerida (Arc) -->
    <path d="M -12 36 A 12 12 0 0 1 12 36" fill="none" stroke="#2563eb" stroke-width="2.5" />
    <text x="18" y="44" font-size="9" font-weight="800" fill="#2563eb">IHttpRest &amp; IWebSocket</text>
    <line x1="0" y1="48" x2="0" y2="75" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-cmp)" />
  </g>

  <!-- COMPONENTE 2: BACKEND SERVER FASTAPI -->
  <g transform="translate(180, 270)">
    <rect width="500" height="240" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
    <!-- Icono componente UML -->
    <rect x="465" y="12" width="25" height="18" fill="#ffffff" stroke="#0f172a" stroke-width="1.2" />
    <rect x="460" y="15" width="10" height="4" fill="#0f172a" />
    <rect x="460" y="23" width="10" height="4" fill="#0f172a" />

    <text x="20" y="30" font-size="10" font-weight="700" fill="#64748b">&lt;&lt;component&gt;&gt;</text>
    <text x="20" y="50" font-size="14" font-weight="900" fill="#0f172a">Backend API Server (FastAPI)</text>
    <text x="20" y="66" font-size="9.5" font-weight="600" fill="#64748b">Directorio: /backend</text>

    <!-- Subpartes de Backend -->
    <g transform="translate(20, 80)">
      <rect width="460" height="45" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="18" font-size="10" font-weight="800" fill="#2563eb">[Controladores: app/routers]</text>
      <text x="10" y="32" font-size="8.5" font-weight="600" fill="#334155">Endpoints REST, Enrutador de telemetría y Despachador de Sockets</text>
    </g>

    <g transform="translate(20, 135)">
      <rect width="460" height="45" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="18" font-size="10" font-weight="800" fill="#0f172a">[Lógica &amp; Validaciones: app/services]</text>
      <text x="10" y="32" font-size="8.5" font-weight="600" fill="#334155">Validación física de rangos (pH, turb), descarte C5 y hash Bcrypt</text>
    </g>

    <g transform="translate(20, 190)">
      <rect width="460" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="10" y="18" font-size="10" font-weight="800" fill="#b45309">[Visión YOLOv8: detector_camara.py]</text>
      <text x="10" y="30" font-size="8.5" font-weight="600" fill="#334155">Inferencia perimetral continua de aforo</text>
    </g>
  </g>

  <!-- COMPONENTE 3: SUBSISTEMA IOT (ESP32) -->
  <g transform="translate(30, 550)">
    <rect width="240" height="105" rx="6" fill="#f8fafc" stroke="#059669" stroke-width="1.8" />
    <rect x="205" y="10" width="25" height="18" fill="#ffffff" stroke="#059669" stroke-width="1.2" />
    <rect x="200" y="13" width="10" height="4" fill="#059669" />
    <rect x="200" y="21" width="10" height="4" fill="#059669" />

    <text x="12" y="26" font-size="9.5" font-weight="700" fill="#64748b">&lt;&lt;component&gt;&gt;</text>
    <text x="12" y="44" font-size="12" font-weight="900" fill="#059669">Subsistema IoT ESP32</text>
    <text x="12" y="62" font-size="8.5" font-weight="600" fill="#334155">• esp32/ (Firmware FreeRTOS)</text>
    <text x="12" y="76" font-size="8.5" font-weight="600" fill="#334155">• simulador_api.py (Pruebas)</text>
    <text x="12" y="92" font-size="8.5" font-weight="700" fill="#0f172a">Directorio: /iot</text>
  </g>

  <!-- Interfaz IoT -> Backend -->
  <path d="M 270 600 L 350 600 L 350 510" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-cmp)" />
  <rect x="275" y="588" width="90" height="18" rx="3" fill="#ffffff" stroke="#059669" stroke-width="1" />
  <text x="320" y="600" text-anchor="middle" font-size="8" font-weight="800" fill="#059669">ITelemetria</text>

  <!-- COMPONENTE 4: SUBSISTEMA PREDICTIVO LSTM -->
  <g transform="translate(590, 550)">
    <rect width="240" height="105" rx="6" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.8" />
    <rect x="205" y="10" width="25" height="18" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" />
    <rect x="200" y="13" width="10" height="4" fill="#7c3aed" />
    <rect x="200" y="21" width="10" height="4" fill="#7c3aed" />

    <text x="12" y="26" font-size="9.5" font-weight="700" fill="#64748b">&lt;&lt;component&gt;&gt;</text>
    <text x="12" y="44" font-size="12" font-weight="900" fill="#7c3aed">Módulo Predictivo LSTM</text>
    <text x="12" y="62" font-size="8.5" font-weight="600" fill="#334155">• lstm/src/ (predictor.py)</text>
    <text x="12" y="76" font-size="8.5" font-weight="600" fill="#334155">• models/ (model_best.keras)</text>
    <text x="12" y="92" font-size="8.5" font-weight="700" fill="#0f172a">Directorio: /lstm</text>
  </g>

  <!-- Interfaz Backend -> LSTM -->
  <path d="M 510 510 L 510 600 L 590 600" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr-cmp)" />
  <rect x="495" y="588" width="85" height="18" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
  <text x="537" y="600" text-anchor="middle" font-size="8" font-weight="800" fill="#7c3aed">IPrediction</text>

  <!-- Interfaz Backend -> BD -->
  <path d="M 430 510 L 430 695" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-cmp)" />
  <circle cx="430" cy="600" r="7" fill="#ffffff" stroke="#16a34a" stroke-width="2" />
  <text x="445" y="604" font-size="8.5" font-weight="800" fill="#15803d">ISqlData (SQLAlchemy Pool)</text>

  <!-- COMPONENTE 5: BASE DE DATOS (POSTGRESQL) -->
  <g transform="translate(230, 695)">
    <rect width="400" height="95" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <rect x="365" y="10" width="25" height="18" fill="#ffffff" stroke="#16a34a" stroke-width="1.2" />
    <rect x="360" y="13" width="10" height="4" fill="#16a34a" />
    <rect x="360" y="21" width="10" height="4" fill="#16a34a" />

    <text x="15" y="26" font-size="10" font-weight="700" fill="#64748b">&lt;&lt;database component&gt;&gt;</text>
    <text x="15" y="46" font-size="13" font-weight="900" fill="#14532d">PostgreSQL 15 Database (ACID)</text>
    <text x="15" y="64" font-size="8.5" font-weight="600" fill="#334155">• Tablas: mediciones_sensores, aforo_registros, usuarios_roles,</text>
    <text x="15" y="78" font-size="8.5" font-weight="600" fill="#334155">  inventario_quimicos y bitácora de auditoría / logs_iot</text>
  </g>

  <!-- PIE -->
  <text x="430" y="835" text-anchor="middle" font-size="10" font-weight="700" fill="#64748b">
    Figura: Diagrama de Componentes UML 2.5 (Puertos e Interfaces de Software) · Sistema Playa Azul · 2026
  </text>
</svg>