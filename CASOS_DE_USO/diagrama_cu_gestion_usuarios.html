<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagrama de Caso de Uso - Gestión de Usuarios (UML)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-800 text-slate-800 min-h-screen p-4 md:p-8 flex flex-col items-center justify-start">

  <!-- BARRA DE ACCIÓN SUPERIOR -->
  <div class="w-full max-w-[950px] mb-5 flex flex-wrap items-center justify-between gap-3 bg-white p-4 rounded-2xl border border-slate-700 shadow-xl">
    <div>
      <div class="flex items-center gap-2">
        <span class="text-xs font-black uppercase tracking-wider bg-blue-600 text-white px-2.5 py-0.5 rounded">UML 2.5</span>
        <h1 class="text-base font-extrabold text-slate-900">Diagrama de Casos de Uso: Gestión de Usuarios</h1>
      </div>
      <p class="text-xs text-slate-500 mt-0.5">Estilo idéntico a tu modelo con actor, elipses, asociaciones y relaciones &lt;&lt;extend&gt;&gt;</p>
    </div>

    <!-- BOTONES DE CONTROL -->
    <div class="flex flex-wrap items-center gap-2.5">
      <!-- Alternar Cuadrícula -->
      <button onclick="toggleGrid()" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs rounded-xl border border-slate-300 transition-all flex items-center gap-1.5">
        <span id="gridIcon">▦</span>
        <span id="gridText">Quitar Cuadrícula</span>
      </button>

      <!-- Alternar Término (aumentar vs registrar) -->
      <button onclick="toggleTexto()" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs rounded-xl border border-slate-300 transition-all flex items-center gap-1.5">
        <span>✏️</span>
        <span id="terminoText">Ver "Registrar usuario"</span>
      </button>

      <!-- Descargar PNG HD -->
      <button id="btnDescargar" onclick="descargarPNG()" class="px-5 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-extrabold text-xs md:text-sm rounded-xl shadow-lg shadow-blue-500/25 transition-all flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        Descargar Imagen PNG (Word HD)
      </button>
    </div>
  </div>

  <!-- CONTENEDOR DEL DIAGRAMA -->
  <div class="w-full max-w-[950px] bg-white rounded-2xl shadow-2xl p-4 md:p-8 border border-slate-200 flex flex-col items-center">
    
    <div id="svgContainer" class="w-full flex justify-center overflow-x-auto">
      <svg id="cuSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 720" width="850" height="720" style="background:#ffffff; font-family:'Plus Jakarta Sans', Arial, sans-serif;">
        <defs>
          <!-- Patrón de cuadrícula como ProcessOn -->
          <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8e8e8" stroke-width="0.8" />
            <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#d5d5d5" stroke-width="1.2" />
          </pattern>

          <!-- Flecha sólida para asociación con actor -->
          <marker id="solid-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#222222" />
          </marker>

          <!-- Flecha abierta para relaciones <<extend>> -->
          <marker id="open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#222222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </marker>
        </defs>

        <!-- Fondo con cuadrícula técnica -->
        <rect id="gridRect" width="100%" height="100%" fill="url(#gridPattern)" />

        <!-- 1. ACTOR: Administrador del sistema -->
        <g id="actor-admin" transform="translate(10, 0)">
          <!-- Cabeza -->
          <circle cx="110" cy="300" r="22" fill="#ffffff" stroke="#222222" stroke-width="2.4" />
          <!-- Tronco -->
          <line x1="110" y1="322" x2="110" y2="400" stroke="#222222" stroke-width="2.4" />
          <!-- Brazos -->
          <line x1="60" y1="350" x2="160" y2="350" stroke="#222222" stroke-width="2.4" />
          <!-- Pierna izquierda -->
          <line x1="110" y1="400" x2="72" y2="475" stroke="#222222" stroke-width="2.4" stroke-linecap="round" />
          <!-- Pierna derecha -->
          <line x1="110" y1="400" x2="148" y2="475" stroke="#222222" stroke-width="2.4" stroke-linecap="round" />
          <!-- Etiqueta del Actor -->
          <text x="110" y="505" text-anchor="middle" font-size="14" font-weight="600" fill="#222222">Administrador</text>
          <text x="110" y="524" text-anchor="middle" font-size="14" font-weight="600" fill="#222222">del sistema</text>
        </g>

        <!-- 2. FLECHA SÓLIDA DE ASOCIACIÓN: Actor -> Administrar usuarios -->
        <line x1="170" y1="365" x2="280" y2="365" stroke="#222222" stroke-width="2" marker-end="url(#solid-arrow)" />

        <!-- 3. CASO DE USO PRINCIPAL: Administrar usuarios -->
        <g id="cu-principal">
          <ellipse cx="375" cy="365" rx="86" ry="46" fill="#ffffff" stroke="#222222" stroke-width="2.2" />
          <text x="375" y="360" text-anchor="middle" font-size="15" font-weight="600" fill="#222222">Administrar</text>
          <text x="375" y="379" text-anchor="middle" font-size="15" font-weight="600" fill="#222222">usuarios</text>
        </g>

        <!-- 4. FLECHAS DISCONTINUAS <<extend>> -->
        <!-- Hacia 1: Aumentar / Registrar usuarios -->
        <path d="M 438 332 L 602 145" fill="none" stroke="#222222" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#open-arrow)" />
        <g transform="translate(506, 218) rotate(-48)">
          <rect x="-35" y="-10" width="70" height="18" fill="#ffffff" opacity="0.9" />
          <text x="0" y="3" text-anchor="middle" font-size="12" font-style="italic" fill="#333333">&lt;&lt;extend&gt;&gt;</text>
        </g>

        <!-- Hacia 2: Modificar usuario -->
        <path d="M 458 350 L 598 296" fill="none" stroke="#222222" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#open-arrow)" />
        <g transform="translate(518, 312) rotate(-21)">
          <rect x="-35" y="-10" width="70" height="18" fill="#ffffff" opacity="0.9" />
          <text x="0" y="3" text-anchor="middle" font-size="12" font-style="italic" fill="#333333">&lt;&lt;extend&gt;&gt;</text>
        </g>

        <!-- Hacia 3: Eliminar usuario -->
        <path d="M 458 380 L 598 434" fill="none" stroke="#222222" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#open-arrow)" />
        <g transform="translate(522, 417) rotate(21)">
          <rect x="-35" y="-10" width="70" height="18" fill="#ffffff" opacity="0.9" />
          <text x="0" y="3" text-anchor="middle" font-size="12" font-style="italic" fill="#333333">&lt;&lt;extend&gt;&gt;</text>
        </g>

        <!-- Hacia 4: Consultar usuario -->
        <path d="M 438 398 L 602 585" fill="none" stroke="#222222" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#open-arrow)" />
        <g transform="translate(508, 510) rotate(48)">
          <rect x="-35" y="-10" width="70" height="18" fill="#ffffff" opacity="0.9" />
          <text x="0" y="3" text-anchor="middle" font-size="12" font-style="italic" fill="#333333">&lt;&lt;extend&gt;&gt;</text>
        </g>

        <!-- 5. CASOS DE USO ESPECÍFICOS (ELIPSES DE LA DERECHA) -->
        <!-- CU 1: Aumentar usuarios / Registrar usuario -->
        <g id="cu-aumentar">
          <ellipse cx="690" cy="110" rx="84" ry="46" fill="#ffffff" stroke="#222222" stroke-width="2.2" />
          <text id="cu1-t1" x="690" y="105" text-anchor="middle" font-size="15" font-weight="600" fill="#222222">aumentar</text>
          <text id="cu1-t2" x="690" y="124" text-anchor="middle" font-size="15" font-weight="600" fill="#222222">usuarios</text>
        </g>

        <!-- CU 2: Modificar usuario -->
        <g id="cu-modificar">
          <ellipse cx="690" cy="280" rx="84" ry="46" fill="#ffffff" stroke="#222222" stroke-width="2.2" />
          <text x="690" y="275" text-anchor="middle" font-size="15" font-weight="600" fill="#222222">modificar</text>
          <text x="690" y="294" text-anchor="middle" font-size="15" font-weight="600" fill="#222222">usuario</text>
        </g>

        <!-- CU 3: Eliminar usuario -->
        <g id="cu-eliminar">
          <ellipse cx="690" cy="450" rx="84" ry="46" fill="#ffffff" stroke="#222222" stroke-width="2.2" />
          <text x="690" y="445" text-anchor="middle" font-size="15" font-weight="600" fill="#222222">eliminar</text>
          <text x="690" y="464" text-anchor="middle" font-size="15" font-weight="600" fill="#222222">usuario</text>
        </g>

        <!-- CU 4: Consultar usuario -->
        <g id="cu-consultar">
          <ellipse cx="690" cy="620" rx="84" ry="46" fill="#ffffff" stroke="#222222" stroke-width="2.2" />
          <text x="690" y="615" text-anchor="middle" font-size="15" font-weight="600" fill="#222222">consultar</text>
          <text x="690" y="634" text-anchor="middle" font-size="15" font-weight="600" fill="#222222">usuario</text>
        </g>
      </svg>
    </div>

    <!-- Pie técnico del diagrama -->
    <div class="mt-4 pt-3 border-t border-slate-200 w-full text-center text-xs font-semibold text-slate-500">
      Figura: Diagrama de Casos de Uso · Módulo de Administración de Usuarios (UML 2.5)
    </div>

  </div>

  <!-- SCRIPT PARA EXPORTACIÓN EN ALTA RESOLUCIÓN Y CONTROLES -->
  <script>
    let conCuadricula = true;
    let usaTerminoAumentar = true;

    function toggleGrid() {
      conCuadricula = !conCuadricula;
      const grid = document.getElementById('gridRect');
      const text = document.getElementById('gridText');
      if (conCuadricula) {
        grid.setAttribute('fill', 'url(#gridPattern)');
        text.innerText = 'Quitar Cuadrícula';
      } else {
        grid.setAttribute('fill', '#ffffff');
        text.innerText = 'Poner Cuadrícula';
      }
    }

    function toggleTexto() {
      usaTerminoAumentar = !usaTerminoAumentar;
      const t1 = document.getElementById('cu1-t1');
      const t2 = document.getElementById('cu1-t2');
      const btn = document.getElementById('terminoText');
      if (usaTerminoAumentar) {
        t1.textContent = 'aumentar';
        t2.textContent = 'usuarios';
        btn.textContent = 'Ver "Registrar usuario"';
      } else {
        t1.textContent = 'registrar';
        t2.textContent = 'usuario';
        btn.textContent = 'Ver "Aumentar usuarios"';
      }
    }

    function descargarPNG() {
      const btn = document.getElementById('btnDescargar');
      const originalText = btn.innerHTML;
      btn.innerHTML = `Generando PNG HD...`;
      btn.disabled = true;

      try {
        const svg = document.getElementById('cuSvg');
        const svgData = new XMLSerializer().serializeToString(svg);
        const canvas = document.createElement('canvas');
        
        // Multiplicador 3x para ultra-alta resolución (2550 x 2160 px, calidad imprenta/tesis)
        const scale = 3;
        canvas.width = 850 * scale;
        canvas.height = 720 * scale;
        const ctx = canvas.getContext('2d');

        const img = new Image();
        const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);

        img.onload = function() {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);

          const enlace = document.createElement('a');
          enlace.download = 'Diagrama_CU_Gestion_Usuarios.png';
          enlace.href = canvas.toDataURL('image/png');
          enlace.click();

          btn.innerHTML = originalText;
          btn.disabled = false;
        };

        img.src = url;
      } catch (err) {
        alert('Error al generar imagen: ' + err.message);
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }
  </script>

</body>
</html>
