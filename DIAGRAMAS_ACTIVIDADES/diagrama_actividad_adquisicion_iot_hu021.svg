<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="1000" height="1200" style="background:#ffffff; font-family:'Plus Jakarta Sans', Arial, sans-serif;">
  <defs>
    <!-- Patrón de cuadrícula técnica -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ebebeb" stroke-width="0.8" />
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#d8d8d8" stroke-width="1.2" />
    </pattern>

    <!-- Flecha de flujo UML -->
    <marker id="arrow-act" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#222222" />
    </marker>
  </defs>

  <!-- Fondo cuadrícula -->
  <rect id="bgRect" width="100%" height="100%" fill="url(#grid)" />

  <!-- TÍTULO DEL DIAGRAMA -->
  <text x="500" y="36" text-anchor="middle" font-size="16" font-weight="800" fill="#222222" letter-spacing="0.5">
    DIAGRAMA DE ACTIVIDADES: ADQUISICIÓN Y TRANSMISIÓN IOT (UML 2.5 - HU-021)
  </text>

  <!-- ─── SWIMLANES / CALLES DE RESPONSABILIDAD ─── -->
  <!-- Cabecera de columnas:
       Col 1: Sensores (pH, Turbidez, Temp) -> 30 a 240 (w=210)
       Col 2: Nodo IoT ESP32 -> 240 a 490 (w=250)
       Col 3: Backend FastAPI & Validación -> 490 a 740 (w=250)
       Col 4: Base de Datos & Dashboard -> 740 a 970 (w=230)
  -->
  <g id="swimlanes-headers">
    <!-- Col 1 -->
    <rect x="30" y="55" width="210" height="38" fill="#f8fafc" stroke="#222222" stroke-width="2" />
    <text x="135" y="79" text-anchor="middle" font-size="12" font-weight="800" fill="#222222">SENSORES FÍSICOS</text>

    <!-- Col 2 -->
    <rect x="240" y="55" width="250" height="38" fill="#f8fafc" stroke="#222222" stroke-width="2" />
    <text x="365" y="79" text-anchor="middle" font-size="12" font-weight="800" fill="#222222">NODO IOT (ESP32)</text>

    <!-- Col 3 -->
    <rect x="490" y="55" width="250" height="38" fill="#f8fafc" stroke="#222222" stroke-width="2" />
    <text x="615" y="79" text-anchor="middle" font-size="12" font-weight="800" fill="#222222">BACKEND API &amp; VALIDADOR</text>

    <!-- Col 4 -->
    <rect x="740" y="55" width="230" height="38" fill="#f8fafc" stroke="#222222" stroke-width="2" />
    <text x="855" y="79" text-anchor="middle" font-size="12" font-weight="800" fill="#222222">BD &amp; DASHBOARD (OPERADOR)</text>
  </g>

  <!-- Líneas divisorias de columnas -->
  <line x1="30" y1="93" x2="30" y2="1140" stroke="#222222" stroke-width="2" />
  <line x1="240" y1="93" x2="240" y2="1140" stroke="#222222" stroke-width="1.8" />
  <line x1="490" y1="93" x2="490" y2="1140" stroke="#222222" stroke-width="1.8" />
  <line x1="740" y1="93" x2="740" y2="1140" stroke="#222222" stroke-width="1.8" />
  <line x1="970" y1="93" x2="970" y2="1140" stroke="#222222" stroke-width="2" />
  <line x1="30" y1="1140" x2="970" y2="1140" stroke="#222222" stroke-width="2" />

  <!-- ─── ELEMENTOS DEL FLUJO DE ACTIVIDAD ─── -->

  <!-- 1. Nodo Inicial en ESP32 -->
  <circle cx="365" cy="120" r="13" fill="#222222" />
  <line x1="365" y1="133" x2="365" y2="160" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow-act)" />

  <!-- Actividad 1: Disparar Timer de Muestreo (ESP32) -->
  <g id="act-1">
    <rect x="275" y="160" width="180" height="50" rx="10" fill="#ffffff" stroke="#222222" stroke-width="2" />
    <text x="365" y="181" text-anchor="middle" font-size="11" font-weight="700" fill="#222222">Disparar temporizador</text>
    <text x="365" y="197" text-anchor="middle" font-size="11" font-weight="700" fill="#222222">periódico de muestreo</text>
  </g>

  <!-- Flecha ESP32 -> Sensores -->
  <path d="M 275 185 L 135 185 L 135 235" fill="none" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow-act)" />

  <!-- Actividad 2: Generar señales analógicas / digitales en sensores -->
  <g id="act-2">
    <rect x="50" y="235" width="170" height="54" rx="10" fill="#ffffff" stroke="#222222" stroke-width="2" />
    <text x="135" y="257" text-anchor="middle" font-size="10.5" font-weight="700" fill="#222222">Emitir voltajes y pulsos</text>
    <text x="135" y="273" text-anchor="middle" font-size="10.5" font-weight="700" fill="#222222">(pH, turbidez y temp.)</text>
  </g>

  <!-- Flecha Sensores -> ESP32 -->
  <path d="M 220 262 L 365 262 L 365 315" fill="none" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow-act)" />

  <!-- Actividad 3: Lectura ADC y Conversión a Magnitudes (ESP32) -->
  <g id="act-3">
    <rect x="270" y="315" width="190" height="54" rx="10" fill="#ffffff" stroke="#222222" stroke-width="2" />
    <text x="365" y="337" text-anchor="middle" font-size="10.5" font-weight="700" fill="#222222">Leer canales ADC y OneWire;</text>
    <text x="365" y="353" text-anchor="middle" font-size="10.5" font-weight="700" fill="#222222">convertir a unidades físicas</text>
  </g>

  <line x1="365" y1="369" x2="365" y2="395" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow-act)" />

  <!-- Actividad 4: Empaquetar JSON estructurado (ESP32) -->
  <g id="act-4">
    <rect x="270" y="395" width="190" height="54" rx="10" fill="#ffffff" stroke="#222222" stroke-width="2" />
    <text x="365" y="417" text-anchor="middle" font-size="10.5" font-weight="700" fill="#222222">Estructurar payload JSON</text>
    <text x="365" y="433" text-anchor="middle" font-size="10.5" font-weight="700" fill="#222222">con timestamp y ID de nodo</text>
  </g>

  <!-- Flecha Transmisión WiFi ESP32 -> Backend -->
  <path d="M 460 422 L 615 422 L 615 470" fill="none" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow-act)" />
  <text x="535" y="415" text-anchor="middle" font-size="9.5" font-weight="700" fill="#475569" font-style="italic">WiFi / HTTP POST</text>

  <!-- Actividad 5: Recibir y Verificar Integridad (Backend) -->
  <g id="act-5">
    <rect x="520" y="470" width="190" height="54" rx="10" fill="#ffffff" stroke="#222222" stroke-width="2" />
    <text x="615" y="492" text-anchor="middle" font-size="10.5" font-weight="700" fill="#222222">Recibir paquete HTTP y</text>
    <text x="615" y="508" text-anchor="middle" font-size="10.5" font-weight="700" fill="#222222">analizar estructura del schema</text>
  </g>

  <line x1="615" y1="524" x2="615" y2="555" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow-act)" />

  <!-- Decisión 1: ¿Lectura válida y en rangos físicos? (Rombo) -->
  <g id="dec-1">
    <polygon points="615,555 700,590 615,625 530,590" fill="#ffffff" stroke="#222222" stroke-width="2" />
    <text x="615" y="586" text-anchor="middle" font-size="9.5" font-weight="800" fill="#222222">¿Lectura válida y</text>
    <text x="615" y="598" text-anchor="middle" font-size="9.5" font-weight="800" fill="#222222">en rangos físicos?</text>
  </g>

  <!-- RAMA NO: Error / Nulo / Corrupto (Hacia la izquierda / descarte) -->
  <line x1="530" y1="590" x2="475" y2="590" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#arrow-act)" />
  <text x="500" y="582" text-anchor="middle" font-size="10" font-weight="800" fill="#b91c1c">[ No / Corrupto ]</text>

  <!-- Actividad 6A: Descartar valor y registrar aviso de error -->
  <g id="act-6a">
    <rect x="290" y="565" width="185" height="52" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2" />
    <text x="382" y="586" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">Descartar valor anómalo</text>
    <text x="382" y="601" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">y registrar aviso en log</text>
  </g>

  <!-- Flecha de log hacia la columna BD -->
  <path d="M 382 617 L 382 660 L 760 660" fill="none" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#arrow-act)" />
  <text x="560" y="652" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b91c1c">Auditoría de anomalías</text>

  <!-- Actividad 7A: Registrar incidencia en tabla de logs -->
  <g id="act-7a">
    <rect x="760" y="635" width="190" height="50" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2" />
    <text x="855" y="656" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">Guardar registro en</text>
    <text x="855" y="671" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">iot_error_logs</text>
  </g>

  <!-- RAMA SÍ: Válido (Hacia abajo / persistencia) -->
  <line x1="615" y1="625" x2="615" y2="720" stroke="#15803d" stroke-width="1.8" marker-end="url(#arrow-act)" />
  <text x="625" y="645" font-size="10.5" font-weight="800" fill="#15803d">[ Sí / Válido ]</text>

  <!-- Fork Bar (Barra de sincronización / concurrencia) -->
  <rect x="525" y="720" width="180" height="6" rx="3" fill="#222222" />

  <!-- Concurrente 1: Guardar en Base de Datos -->
  <path d="M 570 726 L 570 765 L 760 765" fill="none" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow-act)" />

  <g id="act-8b">
    <rect x="760" y="740" width="190" height="50" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="2" />
    <text x="855" y="761" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">Guardar lectura en BD</text>
    <text x="855" y="776" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">(PostgreSQL / Telemetría)</text>
  </g>

  <!-- Concurrente 2: Emitir evento y refrescar dashboard -->
  <path d="M 660 726 L 660 825 L 760 825" fill="none" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow-act)" />

  <g id="act-9b">
    <rect x="760" y="805" width="190" height="54" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <text x="855" y="826" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">Actualizar tarjetas del</text>
    <text x="855" y="842" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">Dashboard en tiempo real</text>
  </g>

  <!-- Join Bar (Barra de Unión Concurrente) -->
  <path d="M 855 790 L 855 805" fill="none" stroke="none" />
  <path d="M 855 790 L 855 890" fill="none" stroke="#222222" stroke-width="1.8" />
  <path d="M 855 859 L 855 890" fill="none" stroke="#222222" stroke-width="1.8" />

  <rect x="770" y="890" width="170" height="6" rx="3" fill="#222222" />

  <!-- Rombo de Fusión (Merge) entre error y éxito -->
  <line x1="855" y1="896" x2="855" y2="940" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow-act)" />
  <path d="M 855 685 L 855 710 L 960 710 L 960 955 L 870 955" fill="none" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#arrow-act)" />

  <polygon points="855,940 870,955 855,970 840,955" fill="#ffffff" stroke="#222222" stroke-width="1.8" />

  <!-- Actividad 10: Responder ACK y esperar ciclo -->
  <line x1="840" y1="955" x2="465" y2="955" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow-act)" />

  <g id="act-10">
    <rect x="275" y="930" width="190" height="50" rx="10" fill="#ffffff" stroke="#222222" stroke-width="2" />
    <text x="370" y="951" text-anchor="middle" font-size="10" font-weight="700" fill="#222222">Aguardar intervalo</text>
    <text x="370" y="967" text-anchor="middle" font-size="10" font-weight="700" fill="#222222">de muestreo (Delay/Timer)</text>
  </g>

  <!-- Flecha de ciclo continuo hacia Actividad 1 -->
  <path d="M 275 955 L 255 955 L 255 185 L 275 185" fill="none" stroke="#222222" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-act)" />
  <text x="250" y="550" text-anchor="middle" font-size="9.5" font-weight="700" fill="#64748b" transform="rotate(-90 250 550)">Nuevo ciclo periódico de adquisición</text>

  <!-- 11. Nodo Final (Opción de Apagado de Nodo) -->
  <line x1="370" y1="980" x2="370" y2="1030" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow-act)" />
  <g id="nodo-final-act" transform="translate(370, 1050)">
    <circle cx="0" cy="0" r="16" fill="#ffffff" stroke="#222222" stroke-width="2" />
    <circle cx="0" cy="0" r="10" fill="#222222" />
  </g>
  <text x="370" y="1085" text-anchor="middle" font-size="10.5" font-weight="700" fill="#222222">Apagado / Mantenimiento</text>

</svg>