<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 980" width="960" height="980" style="background:#ffffff; font-family:'Plus Jakarta Sans', Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ebebeb" stroke-width="0.8" />
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#d8d8d8" stroke-width="1.2" />
    </pattern>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#222222" />
    </marker>
  </defs>

  <rect id="bgRect" width="100%" height="100%" fill="url(#grid)" />

  <text x="480" y="36" text-anchor="middle" font-size="16" font-weight="800" fill="#222222" letter-spacing="0.5">
    DIAGRAMA DE ACTIVIDADES: GESTIÓN Y CONTROL DE USUARIOS (UML 2.5)
  </text>

  <!-- SWIMLANES -->
  <g id="swimlanes-headers">
    <!-- Col 1: Admin -->
    <rect x="30" y="55" width="205" height="38" fill="#f8fafc" stroke="#222222" stroke-width="2" />
    <text x="132" y="79" text-anchor="middle" font-size="12" font-weight="800" fill="#222222">ADMINISTRADOR</text>

    <!-- Col 2: Frontend -->
    <rect x="235" y="55" width="235" height="38" fill="#f8fafc" stroke="#222222" stroke-width="2" />
    <text x="352" y="79" text-anchor="middle" font-size="12" font-weight="800" fill="#222222">FRONTEND (MODAL USUARIO)</text>

    <!-- Col 3: Backend -->
    <rect x="470" y="55" width="240" height="38" fill="#f8fafc" stroke="#222222" stroke-width="2" />
    <text x="590" y="79" text-anchor="middle" font-size="12" font-weight="800" fill="#222222">BACKEND (API FASTAPI)</text>

    <!-- Col 4: Base de Datos -->
    <rect x="710" y="55" width="220" height="38" fill="#f8fafc" stroke="#222222" stroke-width="2" />
    <text x="820" y="79" text-anchor="middle" font-size="12" font-weight="800" fill="#222222">BASE DE DATOS (POSTGRESQL)</text>
  </g>

  <!-- Líneas divisorias -->
  <line x1="30" y1="93" x2="30" y2="940" stroke="#222222" stroke-width="2" />
  <line x1="235" y1="93" x2="235" y2="940" stroke="#222222" stroke-width="1.8" />
  <line x1="470" y1="93" x2="470" y2="940" stroke="#222222" stroke-width="1.8" />
  <line x1="710" y1="93" x2="710" y2="940" stroke="#222222" stroke-width="1.8" />
  <line x1="930" y1="93" x2="930" y2="940" stroke="#222222" stroke-width="2" />
  <line x1="30" y1="940" x2="930" y2="940" stroke="#222222" stroke-width="2" />

  <!-- ─── FLUJO ─── -->
  <!-- 1. INICIO -->
  <circle cx="132" cy="125" r="14" fill="#222222" />
  <line x1="132" y1="139" x2="132" y2="170" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Actividad 1 (Admin): Pulsar nuevo usuario -->
  <g id="act-1">
    <rect x="48" y="170" width="170" height="52" rx="12" fill="#ffffff" stroke="#222222" stroke-width="2" />
    <text x="133" y="193" text-anchor="middle" font-size="11" font-weight="700" fill="#222222">Hacer clic en</text>
    <text x="133" y="209" text-anchor="middle" font-size="11" font-weight="700" fill="#222222">"+ Nuevo Usuario"</text>
  </g>

  <!-- Flujo a Frontend -->
  <line x1="218" y1="196" x2="265" y2="196" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Actividad 2 (Frontend): Desplegar modal -->
  <g id="act-2">
    <rect x="265" y="170" width="175" height="52" rx="12" fill="#ffffff" stroke="#222222" stroke-width="2" />
    <text x="352" y="193" text-anchor="middle" font-size="10.5" font-weight="700" fill="#222222">Desplegar formulario</text>
    <text x="352" y="209" text-anchor="middle" font-size="10.5" font-weight="700" fill="#222222">modal UserModal</text>
  </g>

  <!-- Flujo a Admin para llenado -->
  <path d="M 352 222 L 352 238 L 133 238 L 133 255" fill="none" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Actividad 3 (Admin): Ingresar datos -->
  <g id="act-3">
    <rect x="48" y="255" width="170" height="54" rx="12" fill="#ffffff" stroke="#222222" stroke-width="2" />
    <text x="133" y="276" text-anchor="middle" font-size="10.5" font-weight="700" fill="#222222">Ingresar nombre, apellidos,</text>
    <text x="133" y="291" text-anchor="middle" font-size="10.5" font-weight="700" fill="#222222">correo y seleccionar rol</text>
  </g>

  <line x1="133" y1="309" x2="133" y2="345" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Actividad 4 (Admin): Guardar -->
  <g id="act-4">
    <rect x="48" y="345" width="170" height="48" rx="12" fill="#ffffff" stroke="#222222" stroke-width="2" />
    <text x="133" y="367" text-anchor="middle" font-size="11" font-weight="700" fill="#222222">Pulsar botón</text>
    <text x="133" y="382" text-anchor="middle" font-size="11" font-weight="700" fill="#222222">"Guardar Usuario"</text>
  </g>

  <!-- Flujo a Frontend -->
  <line x1="218" y1="369" x2="265" y2="369" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Actividad 5 (Frontend): Validar y POST -->
  <g id="act-5">
    <rect x="265" y="343" width="175" height="52" rx="12" fill="#ffffff" stroke="#222222" stroke-width="2" />
    <text x="352" y="365" text-anchor="middle" font-size="10.5" font-weight="700" fill="#222222">Validar campos y enviar</text>
    <text x="352" y="381" text-anchor="middle" font-size="10.5" font-weight="700" fill="#222222">petición POST /auth/users</text>
  </g>

  <!-- Flujo a Backend -->
  <line x1="440" y1="369" x2="505" y2="369" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Actividad 6 (Backend): Verificar duplicado -->
  <g id="act-6">
    <rect x="505" y="343" width="170" height="52" rx="12" fill="#ffffff" stroke="#222222" stroke-width="2" />
    <text x="590" y="365" text-anchor="middle" font-size="10.5" font-weight="700" fill="#222222">Verificar disponibilidad</text>
    <text x="590" y="381" text-anchor="middle" font-size="10.5" font-weight="700" fill="#222222">del correo electrónico</text>
  </g>

  <line x1="590" y1="395" x2="590" y2="435" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Decisión 1: ¿Correo ya registrado? -->
  <g id="dec-1">
    <polygon points="590,435 658,470 590,505 522,470" fill="#ffffff" stroke="#222222" stroke-width="2" />
    <text x="590" y="466" text-anchor="middle" font-size="10" font-weight="800" fill="#222222">¿Correo ya</text>
    <text x="590" y="479" text-anchor="middle" font-size="10" font-weight="800" fill="#222222">registrado?</text>
  </g>

  <!-- Rama Sí -> Error hacia Frontend -->
  <line x1="522" y1="470" x2="352" y2="470" stroke="#222222" stroke-width="1.8" />
  <line x1="352" y1="470" x2="352" y2="520" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="470" y="462" font-size="11" font-weight="800" fill="#b91c1c">[ Sí ]</text>

  <!-- Actividad Error en Frontend -->
  <g id="act-err">
    <rect x="265" y="520" width="175" height="50" rx="12" fill="#ffffff" stroke="#222222" stroke-width="2" />
    <text x="352" y="541" text-anchor="middle" font-size="10" font-weight="700" fill="#222222">Mostrar mensaje de error:</text>
    <text x="352" y="556" text-anchor="middle" font-size="10" font-weight="700" fill="#222222">"Correo ya existe en BD"</text>
  </g>

  <!-- Rama No -> Persistir en BD -->
  <line x1="658" y1="470" x2="745" y2="470" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="675" y="462" font-size="11" font-weight="800" fill="#15803d">[ No ]</text>

  <!-- Actividad 7 (BD): Hashear y almacenar -->
  <g id="act-7">
    <rect x="745" y="445" width="155" height="52" rx="12" fill="#ffffff" stroke="#222222" stroke-width="2" />
    <text x="822" y="467" text-anchor="middle" font-size="10" font-weight="700" fill="#222222">Hashear contraseña y</text>
    <text x="822" y="483" text-anchor="middle" font-size="10" font-weight="700" fill="#222222">guardar usuario y rol</text>
  </g>

  <line x1="822" y1="497" x2="822" y2="540" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Actividad 8 (BD): Guardar log de auditoría -->
  <g id="act-8">
    <rect x="745" y="540" width="155" height="52" rx="12" fill="#ffffff" stroke="#222222" stroke-width="2" />
    <text x="822" y="562" text-anchor="middle" font-size="10" font-weight="700" fill="#222222">Registrar log INSERT</text>
    <text x="822" y="578" text-anchor="middle" font-size="10" font-weight="700" fill="#222222">en tabla auditoria</text>
  </g>

  <!-- Retorno a Frontend éxito -->
  <path d="M 745 566 L 620 566 L 620 635 L 440 635" fill="none" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Actividad 9 (Frontend): Cerrar modal y actualizar -->
  <g id="act-9">
    <rect x="265" y="610" width="175" height="52" rx="12" fill="#ffffff" stroke="#222222" stroke-width="2" />
    <text x="352" y="632" text-anchor="middle" font-size="10.5" font-weight="700" fill="#222222">Cerrar modal y recargar</text>
    <text x="352" y="648" text-anchor="middle" font-size="10.5" font-weight="700" fill="#222222">tabla de usuarios activos</text>
  </g>

  <!-- Rombo de Unión -->
  <polygon points="352,760 377,780 352,800 327,780" fill="#ffffff" stroke="#222222" stroke-width="2" />

  <!-- Conexiones al Rombo de Unión sin cruzar act-9 -->
  <line x1="352" y1="662" x2="352" y2="760" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)" />
  <path d="M 265 545 L 248 545 L 248 780 L 327 780" fill="none" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)" />

  <line x1="352" y1="800" x2="352" y2="850" stroke="#222222" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- NODO FINAL -->
  <g id="nodo-final" transform="translate(352, 880)">
    <circle cx="0" cy="0" r="16" fill="#ffffff" stroke="#222222" stroke-width="2" />
    <circle cx="0" cy="0" r="10" fill="#222222" />
  </g>
  <text x="352" y="915" text-anchor="middle" font-size="11" font-weight="700" fill="#222222">Fin de Gestión de Usuario</text>

</svg>
